<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTrack - Driver Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="glass-panel dashboard-container" style="max-width: 500px;">
        <h2>Driver Dashboard</h2>
        
        <div id="controls">
            <button id="startBtn" class="btn btn-primary" style="margin-bottom: 1rem;">Start Delivery</button>
            <button id="stopBtn" class="btn btn-danger hidden">Complete Delivery</button>
        </div>

        <div id="statusArea" class="hidden" style="margin-top: 1.5rem; text-align: center;">
            <p>Status: <span class="status-badge" id="statusBadge">Active</span></p>
            <p style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-muted);">
                Session ID: <span id="sessionDisplay"></span><br>
                <span style="color: var(--success);">Broadcasting Location...</span>
            </p>
            <div style="margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px;">
                <p style="font-size: 0.8rem; color: #cbd5e1;">Give this link to the customer:</p>
                <a id="customerLink" href="#" target="_blank" style="color: var(--primary); font-size: 0.8rem; word-break: break-all;"></a>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/driver.js"></script>
</body>
</html>
